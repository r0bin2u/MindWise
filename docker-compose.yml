services:
  ollama:
    image: ollama/ollama:latest
    container_name: mindwise-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: mindwise-chroma
    ports:
      - "8001:8000"
    volumes:
      - ./data/kb:/chroma/.chroma
    restart: unless-stopped

  app:
    build: .
    container_name: mindwise-app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - ollama
      - chroma
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama_data:
